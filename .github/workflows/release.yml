name: Release

# Push a tag `vX.Y.Z` (matching apps/cli/package.json) to publish:
# the npm package `codefossil` with provenance, and a GitHub release whose notes
# come from CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance (and trusted publishing)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match apps/cli/package.json version $version"; exit 1
          fi
          if ! grep -q "export const VERSION = '$version'" apps/cli/src/version.ts; then
            echo "::error::apps/cli/src/version.ts does not say $version"; exit 1
          fi
          node scripts/changelog-section.mjs "$version" > "$RUNNER_TEMP/notes.md"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build and try the npm package
        run: |
          node scripts/build-npm.mjs
          bash scripts/smoke-npm.sh

      - name: Publish to npm
        working-directory: packaging/npm
        env:
          # Either a granular automation token in the NPM_TOKEN secret, or npm trusted
          # publishing configured for this workflow (then the secret may be empty).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "CODEFOSSIL $TAG" --notes-file "$RUNNER_TEMP/notes.md"
